  /v1/family/reauth:
    post:
      operationId: verifyFamilyReauth
      tags:
        - family
      summary: Synthetic M2 verifyFamilyReauth
      description: Exact Origin is required and checked server-side. Browser Fetch supplies it automatically; non-browser callers must supply it explicitly.
      security:
        - sameOrigin: []
          familySession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyReauthResponse'
        '400':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
        '401':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
        '403':
          description: Safe failure
          content:
            application/json:
              schema:
