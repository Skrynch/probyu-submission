              schema:
                $ref: '#/components/schemas/FamilyError'
        '503':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyProofRequest'
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: *a1
  /v1/family/commands:
    post:
      operationId: executeFamilyCommand
      tags:
        - family
      summary: Synthetic M2 executeFamilyCommand
      description: Exact Origin is required and checked server-side. Browser Fetch supplies it automatically; non-browser callers must supply it explicitly.
      security:
        - sameOrigin: []
          familySession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyResult'
        '400':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
        '401':
          description: Safe failure
          content:
