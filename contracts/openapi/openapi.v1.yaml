        '429':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
        '503':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyProofRequest'
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: *a1
  /v1/family/reauth/challenge:
    post:
      operationId: challengeFamilyReauth
      tags:
