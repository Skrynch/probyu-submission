        '429':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
        '503':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
  /v1/family/documents:
    get:
      operationId: getFamilyDocuments
      tags:
        - family
      summary: Synthetic M2 getFamilyDocuments
      security:
        - familySession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyDocuments'
        '400':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
        '401':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
        '403':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
        '409':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
        '429':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
        '503':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
  /v1/family/login/challenge:
    post:
      operationId: challengeFamilyLogin
      tags:
        - family
      summary: Synthetic M2 challengeFamilyLogin
      description: Exact Origin is required and checked server-side. Browser Fetch supplies it automatically; non-browser callers must supply it explicitly.
      security:
        - sameOrigin: []
          familySession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyChallenge'
        '400':
          description: Safe failure
