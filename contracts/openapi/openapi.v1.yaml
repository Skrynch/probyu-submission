openapi: 3.1.0
info:
  title: Probyu API
  version: 0.1.0
  description: Public fixed demo and explicitly gated synthetic family access.
servers:
  - url: /
    description: Same-origin API
tags:
  - name: system
  - name: demo
  - name: family
  - name: research
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags:
        - system
      summary: Return API liveness without exposing environment details
      responses:
        '200':
          description: API is serving requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/demo/scenarios:
    get:
      operationId: listDemoScenarios
      tags:
        - demo
      summary: List published fixed demo scenarios
      responses:
        '200':
          description: Safe public scenarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoScenarioList'
  /v1/demo/scenarios/{scenarioId}:
    get:
      operationId: getDemoScenario
      tags:
        - demo
      summary: Return one versioned fixed demo scenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-z0-9-]{1,64}$
      responses:
        '200':
          description: Safe public scenario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoScenario'
        '400':
          description: Scenario identifier is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scenario was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/family/bootstrap:
    post:
      operationId: bootstrapFamily
      tags:
        - family
      summary: Synthetic M2 bootstrapFamily
      description: Exact Origin is required and checked server-side. Browser Fetch supplies it automatically; non-browser callers must supply it explicitly.
      security:
        - sameOrigin: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilySession'
        '400':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
        '401':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
        '403':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
        '409':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
        '429':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
        '503':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
      parameters:
        - name: X-Probyu-Bootstrap
          in: header
          required: true
          schema: &a1
            type: string
  /v1/family/session:
    get:
      operationId: getFamilySession
      tags:
        - family
      summary: Synthetic M2 getFamilySession
      security:
        - familySession: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilySession'
        '400':
