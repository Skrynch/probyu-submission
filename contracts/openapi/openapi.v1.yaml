        '503':
          description: Safe failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyError'
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: *a1
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: probyu-api
    DemoScenarioSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - kind
        - title
        - question
        - ageBand
        - durationMinutes
        - contentHash
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 1
        kind:
          type: string
          const: FIXED_DEMO
        title:
          type: string
        question:
          type: string
        ageBand:
          type: string
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 30
        contentHash:
          type: string
          pattern: ^[a-f0-9]{64}$
    DemoScenarioList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/DemoScenarioSummary'
    DemoScenario:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - kind
        - title
        - question
        - ageBand
        - durationMinutes
        - contentHash
        - explanation
        - probe
        - resultOptions
        - reflection
        - observation
        - completion
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 1
        kind:
          type: string
          const: FIXED_DEMO
        title:
          type: string
        question:
          type: string
        ageBand:
          type: string
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 30
        contentHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        explanation:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
        probe:
          $ref: '#/components/schemas/DemoProbe'
        resultOptions:
          type: array
          minItems: 2
          maxItems: 5
          items:
            $ref: '#/components/schemas/DemoResultOption'
        reflection:
          $ref: '#/components/schemas/DemoReflection'
        observation:
          $ref: '#/components/schemas/DemoObservation'
        completion:
          $ref: '#/components/schemas/DemoCompletion'
    DemoProbe:
      type: object
      additionalProperties: false
      required:
        - goal
        - durationMinutes
        - materials
        - steps
        - safetyNotes
      properties:
        goal:
          type: string
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 15
        materials:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
        steps:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
        safetyNotes:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
    DemoResultOption:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - feedback
      properties:
        id:
          type: string
        label:
          type: string
        feedback:
          type: string
    DemoReflection:
      type: object
      additionalProperties: false
      required:
        - prompt
        - options
      properties:
        prompt:
          type: string
        options:
          type: array
          minItems: 2
          maxItems: 5
          items:
            type: string
    DemoObservation:
      type: object
      additionalProperties: false
      required:
        - label
        - limits
      properties:
        label:
          type: string
        limits:
          type: string
    DemoCompletion:
      type: object
      additionalProperties: false
      required:
        - title
        - body
        - cta
      properties:
        title:
          type: string
        body:
          type: string
        cta:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    FamilyAction:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - kind
            - documentVersion
            - ageBand
            - text
            - history
          properties:
            kind:
              type: string
              const: ACTIVATE
            documentVersion: *a1
            ageBand:
              type: string
              enum:
                - 8_10
                - 11_12
                - 13_14
            text:
              type: boolean
            history:
              type: boolean
        - type: object
          additionalProperties: false
          required:
            - kind
            - childId
            - documentVersion
            - purpose
            - granted
          properties:
            kind:
              type: string
              const: CONSENT
            childId: &a2
              type: string
              format: uuid
            documentVersion: *a1
            purpose:
              type: string
              enum:
                - TEXT
                - HISTORY
            granted:
              type: boolean
        - type: object
          additionalProperties: false
          required:
            - kind
            - childId
          properties:
            kind:
              type: string
              const: HANDOFF
            childId: *a2
        - type: object
          additionalProperties: false
          required:
            - kind
          properties:
            kind:
              type: string
              const: RETURN
        - type: object
          additionalProperties: false
          required:
            - kind
            - childId
          properties:
            kind:
              type: string
              const: PAUSE
            childId: *a2
        - type: object
          additionalProperties: false
          required:
            - kind
            - childId
          properties:
            kind:
              type: string
              const: RESUME
            childId: *a2
        - type: object
          additionalProperties: false
          required:
            - kind
          properties:
            kind:
              type: string
              const: REVOKE_BROWSER
    FamilyChild:
      type: object
      additionalProperties: false
      properties:
        id: *a2
        nickname: *a1
        ageBand:
          type: string
          enum:
            - 8_10
            - 11_12
            - 13_14
        status:
          type: string
          enum:
            - ACTIVE
            - PAUSED
        textAllowed:
          type: boolean
        historyAllowed:
          type: boolean
        textGranted:
          type: boolean
        historyGranted:
          type: boolean
        textExpiresAt:
          type: string
          format: date-time
        historyExpiresAt:
          type: string
          format: date-time
      required:
        - id
        - nickname
        - ageBand
        - status
        - textAllowed
        - historyAllowed
    FamilySession:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - ANONYMOUS
            - PARENT
            - CHILD
            - LOCKED
        csrfToken: *a1
        synthetic:
          type: boolean
          const: true
        familyId: *a2
        child:
          $ref: '#/components/schemas/FamilyChild'
      required:
        - mode
        - csrfToken
        - synthetic
    FamilyDocuments:
      type: object
      additionalProperties: false
      properties:
        version: *a1
        text: *a1
        history: *a1
        synthetic:
          type: boolean
          const: true
      required:
        - version
        - text
        - history
        - synthetic
    FamilyChallenge:
      type: object
      additionalProperties: false
      properties:
        challengeId: *a2
        devCode:
          type: string
          pattern: ^[0-9]{6}$
        synthetic:
          type: boolean
          const: true
      required:
        - challengeId
        - devCode
        - synthetic
    FamilyLoginRequest:
      type: object
      additionalProperties: false
      properties:
        identity:
          type: string
          enum:
            - aurora
            - comet
      required:
        - identity
    FamilyProofRequest:
      type: object
      additionalProperties: false
      properties:
        challengeId: *a2
        code:
          type: string
          pattern: ^[0-9]{6}$
      required:
        - challengeId
        - code
    FamilyReauthRequest:
      type: object
      additionalProperties: false
      properties:
        action:
          $ref: '#/components/schemas/FamilyAction'
      required:
        - action
    FamilyReauthResponse:
      type: object
      additionalProperties: false
      properties:
        receiptId: *a2
      required:
        - receiptId
    FamilyCommand:
      type: object
      additionalProperties: false
      properties:
        action:
          $ref: '#/components/schemas/FamilyAction'
        receiptId: *a2
        idempotencyKey: *a2
      required:
        - action
        - receiptId
        - idempotencyKey
    FamilyResult:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
      required:
        - ok
    FamilyError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - FORBIDDEN
            - INVALID_REQUEST
            - CONFLICT
            - EXPIRED_PROOF
            - INVALID_CODE
            - RATE_LIMITED
            - UNAVAILABLE
        remainingAttempts:
          type: integer
          minimum: 0
          maximum: 4
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 900
      required:
        - code
  securitySchemes:
    sameOrigin:
      type: apiKey
      in: header
      name: Origin
      description: Browser-managed CSRF origin check; not an identity credential. Must equal the configured application origin.
    familySession:
      type: apiKey
      in: cookie
      name: __Host-probuyu_session
