  /v1/family/logout:
    post:
      operationId: logoutFamily
      tags:
        - family
      summary: Synthetic M2 logoutFamily
      description: Exact Origin is required and checked server-side. Browser Fetch supplies it automatically; non-browser callers must supply it explicitly.
      security:
        - sameOrigin: []
          familySession: []
      responses:
        '200':
          description: Success
          content:
